{% extends "admin/base_site.html" %}
{% load i18n admin_urls static admin_modify %}

{% block content %}
<div id="content-main">
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <fieldset class="module aligned">
            <div class="form-row">
                <div>
                    <label for="id_pdf_file">فایل PDF:</label>
                    {{ form.pdf_file }}
                </div>
            </div>
        </fieldset>
        <div class="submit-row">
            <input type="submit" value="آپلود PDF" class="default" />
        </div>
    </form>
</div>
{% endblock %}
